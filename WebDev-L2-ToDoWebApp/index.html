```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <p class="label">STAY ORGANIZED</p>

            <h1>My To-Do List</h1>

            <p class="subtitle">
                Plan your day. Complete your goals.
            </p>
        </header>


        <section class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >

            <button id="addBtn">Add Task</button>

        </section>


        <!-- Pending Tasks -->

        <section class="task-section">

            <div class="section-header">
                <h2>Pending Tasks</h2>

                <span class="count pending-count">
                    <span id="pendingCount">0</span> pending
                </span>
            </div>

            <ul id="pendingList"></ul>

            <div id="pendingEmpty" class="empty-state">
                <div class="empty-icon">✓</div>

                <h3>No pending tasks</h3>

                <p>You're all caught up!</p>
            </div>

        </section>


        <!-- Completed Tasks -->

        <section class="task-section completed-section">

            <div class="section-header">
                <h2>Completed Tasks</h2>

                <span class="count completed-count">
                    <span id="completedCount">0</span> completed
                </span>
            </div>

            <ul id="completedList"></ul>

            <div id="completedEmpty" class="empty-state">
                <div class="empty-icon">✓</div>

                <h3>No completed tasks</h3>

                <p>Completed tasks will appear here.</p>
            </div>

        </section>


        <button id="clearCompleted" class="clear-btn">
            Clear Completed
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
```
