<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Authentication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon">✓</div>

                <h1>Welcome</h1>

                <p>Secure access to your account</p>
            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="loginPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>


            <!-- Register -->
            <div class="register-section">

                <p>
                    Don't have an account?
                </p>

                <button
                    id="showRegister"
                    class="link-btn"
                >
                    Create an account
                </button>

            </div>


            <!-- Register Form -->
            <form
                id="registerForm"
                class="hidden"
            >

                <div class="form-title">

                    <h2>Create Account</h2>

                    <p>
                        Register a new account
                    </p>

                </div>


                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 6 characters"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="registerPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="message"
                ></p>


                <button
                    type="button"
                    id="showLogin"
                    class="back-btn"
                >
                    ← Back to Login
                </button>

            </form>


            <!-- Logged In -->
            <section
                id="dashboard"
                class="hidden dashboard"
            >

                <div class="success-icon">
                    ✓
                </div>

                <h2>
                    Login Successful
                </h2>

                <p id="welcomeMessage"></p>

                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </section>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
