<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <p class="label">STAY ORGANIZED</p>

            <h1>My To-Do List</h1>

            <p class="subtitle">
                Plan your day. Complete your goals.
            </p>
        </header>


        <section class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >

            <button id="addBtn">
                Add Task
            </button>

        </section>


        <section class="controls">

            <div class="task-count">
                <span id="taskCount">0</span> tasks
            </div>

            <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>

            </div>

        </section>


        <ul id="taskList"></ul>


        <div id="emptyState" class="empty-state">

            <div class="empty-icon">✓</div>

            <h2>No tasks yet</h2>

            <p>
                Add a task above and start getting things done.
            </p>

        </div>


        <button id="clearCompleted" class="clear-btn">
            Clear Completed
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
